<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 842 595" role="img" aria-labelledby="title desc">
<title id="title">The same market tools serve both path families</title><desc id="desc">Tools nominate AMM routes. Helpers measures complete plans. Existing useful continuation consumption and pure Core targets nominate smaller funding before fresh market discovery; each changed complete body returns to Helpers before selection.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#3e596d"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#142b42}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#167c80}
    .title{font-size:23px;font-weight:700}
    .subtitle{font-size:12.5px;fill:#53697a}
    .lane-label{font-size:10px;font-weight:700;letter-spacing:1.2px;fill:#53697a}
    .node{fill:#fff;stroke:#c8d6df;stroke-width:1.2}
    .fresh{fill:#e8f6f2;stroke:#3d9e90;stroke-width:1.2}
    .heading{font-size:14px;font-weight:700}
    .body{font-size:12px}
    .body-large{font-size:12.5px}
    .muted{fill:#53697a}
    .line{fill:none;stroke:#3e596d;stroke-width:1.5}
    .bus{fill:none;stroke:#3e596d;stroke-width:1.5}
    .dashed{fill:none;stroke:#8a9cab;stroke-width:1.3;stroke-dasharray:4 4}
    .step{fill:#fff;stroke:#16858a;stroke-width:1.4}
    .step-text{font-size:10px;font-weight:700;fill:#167c80;text-anchor:middle;dominant-baseline:central}
    .source{font-size:9.5px;fill:#64798a}
  </style>
</defs>
<rect width="842" height="595" fill="#fff"/>
<text x="42" y="30" class="eyebrow">CYBERGOLD · CURRENT QUOTER · 03</text>
<text x="42" y="61" class="title">The same market tools serve both path families</text>
<text x="42" y="81" class="subtitle">Tools nominate AMM routes; Helpers measures the complete plan</text><text x="42" y="110" class="body-large">Five parallel suppliers, started when a market-segment query is requested</text><rect x="42" y="126" width="138" height="66" rx="8" class="node"/><text x="54" y="151" class="heading">Custom</text><text x="54" y="173" class="body">Graph paths</text><path d="M111 192 V211" class="bus"/><rect x="197" y="126" width="138" height="66" rx="8" class="node"/><text x="209" y="151" class="heading">AlphaRouter</text><text x="209" y="173" class="body">Local worker</text><path d="M266 192 V211" class="bus"/><rect x="352" y="126" width="138" height="66" rx="8" class="node"/><text x="364" y="151" class="heading">UniRoute local</text><text x="364" y="173" class="body">Local worker</text><path d="M421 192 V211" class="bus"/><rect x="507" y="126" width="138" height="66" rx="8" class="node"/><text x="519" y="151" class="heading">UniRoute API</text><text x="519" y="173" class="body">Trading API</text><path d="M576 192 V211" class="bus"/><rect x="662" y="126" width="138" height="66" rx="8" class="node"/><text x="674" y="151" class="heading">GuideStar</text><text x="674" y="173" class="body">Trading API</text><path d="M731 192 V211" class="bus"/>
<path d="M111 211 H731" class="bus"/>
<path d="M421 211 V237" class="line"/><polygon points="421.00,237.00 418.00,230.00 424.00,230.00" fill="#3e596d"/><circle cx="421" cy="221" r="10" class="step"/><text x="421" y="221" class="step-text">1</text>
<rect x="42" y="237" width="758" height="60" rx="8" class="fresh"/>
<text x="57" y="260" class="heading">CyberGold AMM adapter · one shared market-route API</text>
<text x="57" y="281" class="body-large">Native paths, encoded splits and Core anchor; no opposed use of a physical pool</text>
<path d="M421 297 V316 H217 V339 M421 316 H625 V339" class="bus"/>
<path d="M217 327 V339" class="line"/><polygon points="217.00,339.00 214.00,332.00 220.00,332.00" fill="#3e596d"/><circle cx="217" cy="317" r="10" class="step"/><text x="217" y="317" class="step-text">2</text>
<path d="M625 327 V339" class="line"/><polygon points="625.00,339.00 622.00,332.00 628.00,332.00" fill="#3e596d"/><circle cx="625" cy="317" r="10" class="step"/><text x="625" y="317" class="step-text">2</text>
<rect x="42" y="339" width="350" height="75" rx="8" class="node"/>
<text x="57" y="363" class="heading">Pure market plan</text>
<text x="57" y="385" class="body-large">Input → AMM trade(s) → output</text>
<text x="57" y="405" class="body-large">No Core issue or redeem action</text>
<rect x="450" y="339" width="350" height="75" rx="8" class="node"/>
<text x="465" y="363" class="heading">Market + Core plan</text>
<text x="465" y="385" class="body">Issue: AMM acquisitions → Core → residual handling</text>
<text x="465" y="405" class="body">Redeem: Core → AMM output conversions</text>
<path d="M217 414 V426 H625 V414" class="bus"/>
<path d="M421 426 V439" class="line"/><polygon points="421,439 418,432 424,432" fill="#3e596d"/><circle cx="421" cy="426" r="10" class="step"/><text x="421" y="426" class="step-text">3</text>
<rect x="42" y="439" width="758" height="54" rx="8" class="fresh"/>
<text x="57" y="461" class="heading">One latest Helpers executeExactInput eth_call for each complete proposal</text>
<text x="57" y="481" class="body-large">Measures all AMM + Core actions, fees and shared-pool impact together.</text>
<path d="M421 493 V506" class="line"/><polygon points="421,506 418,499 424,499" fill="#3e596d"/>
<rect x="42" y="506" width="758" height="48" rx="8" class="node"/>
<text x="57" y="526" class="heading">Measured Core + useful residual: direct exact-output funding</text>
<text x="57" y="545" class="body">Independent validation and market composition; fresh residual discovery progresses alongside.</text>
<path d="M800 530 H818 V467 H800" class="line"/><polygon points="800,467 807,464 807,470" fill="#3e596d"/>
<rect x="42" y="562" width="758" height="20" rx="6" fill="#f6f8fa"/>
<text x="54" y="576" class="body">One finite pass per root; each changed complete body returns to Helpers before selection.</text>
<text x="42" y="589" class="source">Sources: quoter/providers, amm_adapter, evaluate, funding, inverse, core_funding, plan_simulation; tx_preparation.</text>
